<svg xmlns="http://www.w3.org/2000/svg" width="880" height="500" viewBox="0 0 880 500" role="img" aria-label="In a terminal: npx opencontact, opencontact card, opencontact text. On the phone: Acme Dental, saved as a contact with its logo, texts a reminder, sends its card, and answers the customer's question.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <symbol id="logo" viewBox="0 0 40 40">
      <circle cx="20" cy="20" r="20" fill="#c8102e"/>
      <path d="M13.5 12.5c2.2-1.4 4.4-.6 6.5.3 2.1-.9 4.3-1.7 6.5-.3 2.5 1.6 2.6 5.4 1.5 8.6-.8 2.4-1.2 4.8-1.6 7.2-.3 1.6-2.1 1.9-2.6.3l-1.6-4.9c-.5-1.5-3.9-1.5-4.4 0l-1.6 4.9c-.5 1.6-2.3 1.3-2.6-.3-.4-2.4-.8-4.8-1.6-7.2-1.1-3.2-1-7 1.5-8.6z" fill="#fff"/>
    </symbol>
  </defs>
  <rect width="880" height="500" rx="18" fill="#f6f7f9"/>

  <!-- terminal -->
  <rect x="24" y="62" width="468" height="376" rx="12" fill="#0d1117"/>
  <circle cx="46" cy="84" r="6" fill="#ff5f57"/><circle cx="66" cy="84" r="6" fill="#febc2e"/><circle cx="86" cy="84" r="6" fill="#28c840"/>
  <text x="258" y="88" text-anchor="middle" class="mono" fill="#6e7681">~/acme</text>
  <g class="mono">
    <text x="44" y="126" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> npx opencontact</text>
    <text x="60" y="148" fill="#7ee787">✓</text><text x="78" y="148" fill="#8b949e">imsg 0.19.1, signed release</text>
    <text x="60" y="170" fill="#7ee787">✓</text><text x="78" y="170" fill="#8b949e">brain: Bland · Acme Dental, 6 scenarios</text>
    <text x="60" y="192" fill="#7ee787">✓</text><text x="78" y="192" fill="#8b949e">answers everyone ·</text><text x="226" y="192" fill="#3fb950" font-weight="700">LIVE</text>

    <text x="44" y="228" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> opencontact card "Acme Dental" --logo tooth.png</text>
    <text x="60" y="250" fill="#7ee787">✓</text><text x="78" y="250" fill="#8b949e">card: Acme Dental · logo · +1 (415) 555-0134</text>

    <text x="44" y="286" fill="#e6edf3"><tspan fill="#7ee787">$</tspan> opencontact text +14155550123 "remind Sam"</text>
    <text x="60" y="308" fill="#7ee787">✓</text><text x="78" y="308" fill="#8b949e">sent + contact card</text>
    <text x="60" y="330" fill="#79c0ff">→</text><text x="78" y="330" fill="#e6edf3">Hi Sam, it's Acme Dental! Your cleaning…</text>

    <text x="44" y="366" fill="#6e7681">inbound</text><text x="124" y="366" fill="#8b949e">****0123 "C! also do you take…"</text>
    <text x="44" y="388" fill="#6e7681">replied</text><text x="124" y="388" fill="#8b949e">"Yes, PPO and Premier…"</text>
    <rect x="44" y="404" width="8" height="15" fill="#e6edf3"/>
  </g>

  <!-- arrow -->
  <path d="M502 250 L 540 250" stroke="#9aa4b2" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M540 244 L 550 250 L 540 256 Z" fill="#9aa4b2"/>

  <!-- phone -->
  <rect x="560" y="18" width="296" height="464" rx="40" fill="#111"/>
  <rect x="570" y="28" width="276" height="444" rx="31" fill="#fff"/>
  <rect x="668" y="38" width="80" height="20" rx="10" fill="#111"/>
  <g class="sans">
    <!-- header: the saved contact, branded -->
    <use href="#logo" x="689" y="72" width="38" height="38"/>
    <text x="702" y="128" text-anchor="middle" font-size="12.5" font-weight="600" fill="#111" textLength="76" lengthAdjust="spacingAndGlyphs">Acme Dental</text>
    <path d="M745 120 l4 4 l-4 4" stroke="#8e8e93" stroke-width="1.6" fill="none"/>
    <line x1="570" y1="144" x2="846" y2="144" stroke="#e5e5ea"/>
    <text x="708" y="164" text-anchor="middle" font-size="10.5" fill="#8e8e93" textLength="128" lengthAdjust="spacingAndGlyphs">iMessage · Today 4:12 PM</text>

    <!-- agent opener -->
    <rect x="582" y="176" width="214" height="74" rx="17" fill="#e9e9eb"/>
    <text x="597" y="198" font-size="13" fill="#111" textLength="184" lengthAdjust="spacingAndGlyphs">Hi Sam, it's Acme Dental! Your</text>
    <text x="597" y="216" font-size="13" fill="#111" textLength="176" lengthAdjust="spacingAndGlyphs">cleaning is Thursday at 4:30.</text>
    <text x="597" y="234" font-size="13" fill="#111" textLength="116" lengthAdjust="spacingAndGlyphs">Reply C to confirm.</text>

    <!-- contact card -->
    <rect x="582" y="258" width="214" height="62" rx="17" fill="#e9e9eb"/>
    <use href="#logo" x="594" y="269" width="40" height="40"/>
    <text x="644" y="286" font-size="13.5" font-weight="600" fill="#111" textLength="84" lengthAdjust="spacingAndGlyphs">Acme Dental</text>
    <text x="644" y="304" font-size="11.5" fill="#6e6e73" textLength="104" lengthAdjust="spacingAndGlyphs">+1 (415) 555-0134</text>
    <path d="M776 283 l5 6 l-5 6" stroke="#8e8e93" stroke-width="1.8" fill="none"/>

    <!-- customer -->
    <rect x="606" y="332" width="228" height="34" rx="17" fill="#0a84ff"/>
    <text x="720" y="354" text-anchor="middle" font-size="13" fill="#fff" textLength="200" lengthAdjust="spacingAndGlyphs">C! also do you take Delta Dental?</text>

    <!-- agent -->
    <rect x="582" y="378" width="206" height="56" rx="17" fill="#e9e9eb"/>
    <text x="597" y="400" font-size="13" fill="#111" textLength="178" lengthAdjust="spacingAndGlyphs">Yes, PPO and Premier. See you</text>
    <text x="597" y="418" font-size="13" fill="#111" textLength="60" lengthAdjust="spacingAndGlyphs">Thursday!</text>
  </g>
</svg>
